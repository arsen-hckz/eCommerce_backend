name: Deploy to DigitalOcean

# Manual only (Actions tab -> Run workflow). This droplet also hosts the
# Senario shop, so a push must never run deploy.sh on it automatically.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > key.pem
          chmod 600 key.pem
          ssh -i key.pem -o StrictHostKeyChecking=no root@68.183.69.101 "/var/www/eCommerce_backend/deploy.sh"
          rm key.pem